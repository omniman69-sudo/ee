<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NomadNet Micron Book Preview</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --terminal-bg: #15181c;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal-container {
            width: 100%;
            max-width: 680px;
            background-color: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .terminal-header {
            background-color: #1f242c;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .terminal-title {
            margin-left: 10px;
            font-size: 13px;
            color: #8b949e;
            flex-grow: 1;
            text-align: center;
            font-family: sans-serif;
        }

        /* Container for the rendered output */
        #micron-rendered {
            padding: 30px 40px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 15px;
        }

        /* Basic fallback styling for links parsed from micron format */
        a {
            color: var(--accent-color);
            text-decoration: underline;
            cursor: pointer;
        }
        a:hover {
            color: #79c0ff;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-header">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <div class="terminal-title">nomadnet://book-preview.mu</div>
    </div>
    
    <!-- This is where your book will display -->
    <div id="micron-rendered"></div>
</div>

<script>
    // 1. Paste your raw Micron Book Code inside these backticks
    const micronCode = `[w:65]
|c
*[b:000,f:fff]  CHAPTER I: THE OLD MESH  *

|c
_An Introduction to Free Networking_

[]
[]
|j
It was a cold, quiet night when the first packet made its way across the valley. The nodes, scattered like tiny digital campfires across the ridge lines, had spent weeks in complete isolation. 

[]
For years, the old infrastructure had been failing. The cables beneath the streets were dark, and the central towers stood silent. But on this night, a single LoRa transceiver blinked to life on a 12-volt battery. 

[]
> "The network wasn't built by a corporation. It was patched together by anyone who had an old radio and a desire to speak across the dark."

[]
|j
The text unrolled across the terminal screen slowly, matching the agonizingly beautiful pace of a 300 baud connection. Each character felt intentional. In a world that had forgotten how to wait, the mesh forced a patient, deliberate focus.

[]
[]
|c
Download the complete package:
[h:https://yourcodebergsite.com/book.epub|📥 Download EPUB Book]

[]
|c
* * *`;

    // 2. A lightweight JS browser interpreter to parse the core formatting tags
    function parseMicronToHtml(text) {
        let lines = text.split('\n');
        let htmlOutput = "";
        let currentAlignment = "left"; // default

        lines.forEach(line => {
            let trimmed = line.trim();

            // Handle alignment shifts
            if (trimmed === "|c") { currentAlignment = "center"; return; }
            if (trimmed === "|j") { currentAlignment = "justify"; return; }
            if (trimmed === "|l") { currentAlignment = "left"; return; }
            if (trimmed === "|r") { currentAlignment = "right"; return; }
            
            // Handle width modifiers, horizontal rules, or empty breaks
            if (line.startsWith("[w:") || trimmed === "---") return;
            if (trimmed === "[]") {
                htmlOutput += "<br>";
                return;
            }

            let processedLine = line;

            // Simple Bold tag match (*text*)
            processedLine = processedLine.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
            
            // Simple Underline tag match (_text_)
            processedLine = processedLine.replace(/_(.*?)_/g, '<u>$1</u>');

            // Parse Link / EPUB download format [h:url|label]
            processedLine = processedLine.replace(/\[h:(.*?)\|(.*?)\]/g, '<a href="$1" target="_blank">$2</a>');

            // Wrap in styled block divs to mirror terminal layout rules
            if (processedLine.trim() !== "") {
                htmlOutput += \`<div style="text-align: \${currentAlignment};">\${processedLine}</div>\`;
            } else {
                htmlOutput += "<div>&nbsp;</div>";
            }
        });

        return htmlOutput;
    }

    // 3. Inject the parsed content cleanly into the DOM window
    document.getElementById('micron-rendered').innerHTML = parseMicronToHtml(micronCode);
</script>

</body>
</html>
